# Render Blueprint: API web service + managed PostgreSQL.
# Render dashboard → New → Blueprint → select this repository.
# Values marked `sync: false` are prompted for during setup (secrets stay out of git).

databases:
  - name: chat-db
    plan: free
    databaseName: chat
    user: chat
    ipAllowList: [] # only reachable from Render services

services:
  - type: web
    name: chat-api
    runtime: node
    plan: free
    healthCheckPath: /health
    # Dev dependencies (TypeScript) are needed to compile, even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations are forward-only and idempotent, so they run on every deploy.
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString # internal URL, no TLS needed inside Render
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false # e.g. https://your-site.netlify.app
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false # paste the private_key value from the service-account JSON
