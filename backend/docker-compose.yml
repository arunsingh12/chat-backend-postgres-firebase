# Local infrastructure for development: PostgreSQL + Firestore emulator.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chat -d chat']
      interval: 5s
      timeout: 3s
      retries: 10

  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    restart: unless-stopped
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=chat-local
    ports:
      - '8080:8080'

volumes:
  postgres-data:
